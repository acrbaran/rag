    type: object
  internal_handler.RuntimeQueuesResponse:
    properties:
      available:
        type: boolean
      model_limiter_available:
        type: boolean
      models:
        items:
          $ref: '#/definitions/github_com_acrbaran_rag_internal_models_limiter.RuntimeStat'
        type: array
      parse_concurrency:
        description: compatibility alias for upstream_concurrency
        type: integer
      pools:
        items:
          $ref: '#/definitions/internal_handler.RuntimeWorkerPool'
        type: array
      queues:
        items:
          $ref: '#/definitions/types.QueueStat'
        type: array
      timestamp:
        type: integer
      upstream_concurrency:
        type: integer
      wiki_concurrency:
        description: compatibility field
        type: integer
    type: object
  internal_handler.RuntimeTasksResponse:
    properties:
