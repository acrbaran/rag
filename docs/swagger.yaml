        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  internal_handler.ResetUserPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        type: string
    required:
    - email
    - new_password
    type: object
  internal_handler.RevokeSystemAdminRequest:
