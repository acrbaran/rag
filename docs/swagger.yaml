  types.ModelParameters:
    properties:
      api_key:
        type: string
      app_id:
        description: Model kimlik bilgileri
        type: string
      app_secret:
        description: AES-256 ile şifrelenerek saklanır; asıl olarak üst akış API Key'i
          taşır
        type: string
      base_url:
        type: string
      context_window:
        description: |-
          ContextWindow is the model's total context window in tokens and
          MaxOutputTokens the most it emits in one response. Both are provider
          facts the agent cannot discover but has to act on: the context window is
          what decides when conversation history gets compacted, and assuming a
          window larger than the real one means compaction never fires and the
          provider rejects the request mid-conversation instead. 0 means unknown,
          which falls back to DefaultMaxContextTokens.
        type: integer
      custom_headers:
        additionalProperties:
          type: string
        description: |-
          CustomHeaders, uzak model API'si çağrılırken özel HTTP istek başlıklarının eklenmesine izin verir,
          Kullanımı Python OpenAI SDK'sindeki extra_headers parametresine benzer,
          Yaygın kullanım senaryoları arasında kurumsal ağ geçidi kimlik doğrulama bilgilerinin iletilmesi, izleme ID'si ve yönlendirme tanımlayıcıları bulunur.
          Ayrılmış alanlar (Authorization, api-key, Content-Type, Accept vb.), imza/kimlik doğrulama sürecinin bozulmasını önlemek için çalışma zamanında yok sayılır.
        type: object
      embedding_parameters:
        $ref: '#/definitions/types.EmbeddingParameters'
      extra_config:
        additionalProperties:
          type: string
        description: Provider-specific configuration
        type: object
      interface_type:
        type: string
      max_concurrency:
        description: |-
          MaxConcurrency caps concurrent in-flight BACKGROUND (ingestion /
          enrichment) calls to THIS specific model, keyed by model ID and shared
          across all replicas. 0 (the default) means "fall back to the
          process-wide model.max_concurrency". Interactive user-facing calls are
          never gated. Only chat / vlm / embedding honour this (see limiter.Gate).
        type: integer
      max_output_tokens:
        type: integer
      parameter_size:
        description: Model parameter size (e.g., "7B", "13B", "70B")
        type: string
      provider:
        description: 'Provider identifier: openai, aliyun, zhipu, generic'
        type: string
      spec:
        allOf:
        - $ref: '#/definitions/types.ModelSpecOverride'
        description: |-
          Spec overrides the catalog entry for this row: protocol, capability
          flags and the flat protocol compat object. Everything omitted is
          inherited from the vendor catalog (see internal/models/catalog).
      supports_vision:
        description: Whether the model accepts image/multimodal input
        type: boolean
    type: object
  types.ModelSpecOverride:
    properties:
      api:
        type: string
      compat:
        additionalProperties: {}
        description: |-
