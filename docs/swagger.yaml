      source_kb_id:
        type: string
      target_kb_id:
        type: string
      task_id:
        type: string
    type: object
  internal_handler.MoveKnowledgeToFolderRequest:
    properties:
      folder_path:
        description: |-
          FolderPath is the destination folder; the empty string is the knowledge
          base top level. It is deliberately not `binding:"required"` so documents
          can be moved back out of every folder.
        type: string
      kb_id:
        type: string
      knowledge_ids:
        items:
          type: string
        type: array
    required:
    - kb_id
    - knowledge_ids
    type: object
  internal_handler.PromoteUserToSystemAdminRequest:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  internal_handler.RemoteModelCheckRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret, ikinci bir anahtar bölümü gerektiren LKEAP / Volcengine
          Rerank gibi durumlar için kullanılır (model Parameters.AppSecret'e karşılık
          gelir).
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: Boş olduğunda gerektiğinde varsayılan olarak "remote" kullanılır
        type: string
      spec:
        $ref: '#/definitions/types.ModelSpecOverride'
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  internal_handler.RenameKnowledgeFolderRequest:
    properties:
