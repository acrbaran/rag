      - Alan Yönetimi
  /user/favorites:
    get:
      description: Lists this user's starred resources in the current workspace for
        a given type
      parameters:
      - description: Resource type (kb | agent)
        in: query
        name: type
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List my favorites
      tags:
      - User
    post:
      parameters:
      - description: Type + id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AddFavoriteRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Star a resource
      tags:
      - User
  /user/favorites/{type}/{id}:
    delete:
      parameters:
      - description: Resource type
        in: path
        name: type
        required: true
        type: string
      - description: Resource id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Unstar a resource
