        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create sandbox config
      tags:
      - SandboxConfig
  /sandbox-configs/{id}:
    delete:
      description: Soft-delete a sandbox backend config. force=true only overrides
        unverifiable provider inventory, never confirmed live sandboxes.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Force delete when inventory is unverifiable
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Live sandboxes or unverifiable inventory
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete sandbox config
      tags:
      - SandboxConfig
    get:
      description: Retrieve a workspace sandbox backend config with credentials masked.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sandbox config
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Sandbox config not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get sandbox config
      tags:
      - SandboxConfig
    put:
      consumes:
      - application/json
      description: Update a sandbox backend config. Identity-field changes are refused
        while the config owns live or paused sandboxes.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated sandbox config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sandboxConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated sandbox config
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation failure
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Sandbox config not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "409":
          description: Live sandboxes or unverifiable inventory
          schema:
            additionalProperties: true
            type: object
        "423":
          description: Sandbox config is being modified by another request
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update sandbox config
      tags:
      - SandboxConfig
