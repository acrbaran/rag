        type: array
      folders:
        description: Folders lists the top-level folder names present.
        items:
          type: string
        type: array
      latest_at:
        type: string
      profiled_count:
        description: ProfiledCount is how many of them carried a document profile.
        type: integer
      raw_topics:
        description: RawTopics counts documents per normalized topic keyword before
          merging.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
      tags:
        description: Tags counts documents per knowledge-base tag.
        items:
          $ref: '#/definitions/types.NamedCount'
        type: array
    type: object
