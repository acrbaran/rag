  /auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: |-
        Geçerli kullanıcı için hedef alanda erişim belirtecini yeniden düzenler; kullanıcının hedef alanda active üyelik ilişkisi olması gerekir (kiracılar arası süper kullanıcılar hariç).
        Başarılı belirteç yenileme, hedef alanı 「son etkin kiracı」 tercihine yazar; sonraki giriş ve refresh bu alanda gerçekleşir (refresh JWT, tenant_id içermez).
        Bu tercih hesap düzeyindedir: tek bir belirteç yenileme, bu kullanıcının tüm cihazlarındaki sonraki giriş/refresh hedefini değiştirir. Tercih yazılamazsa tüm belirteç yenileme işlemi başarısız olur ve yeni token verilmez.
      parameters:
      - description: Değiştirme isteği
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
            tenant_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "400":
          description: Parametre hatası
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: Bu alan için üyelik ilişkisi yok veya tercih yazılamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Etkin alanı değiştir
      tags:
      - Kimlik Doğrulama
