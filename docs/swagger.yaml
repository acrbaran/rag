        masked in the response.
      parameters:
      - description: Sandbox backend config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sandboxConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created sandbox config
          schema:
            additionalProperties: true
