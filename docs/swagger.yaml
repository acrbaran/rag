  /sandbox-configs/{id}/skills/{skillId}/stop:
    post:
      description: Abort an in-flight install so the operator can retry or uninstall.
        After a process restart the row may still say installing with no live process;
        this rewrites it immediately instead of waiting for the stuck-run reaper.
        Removal is not stopped.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill ID
        in: path
        name: skillId
        required: true
