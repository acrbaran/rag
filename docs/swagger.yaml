securityDefinitions:
  ApiKeyAuth:
    description: 'API Key kimlik doğrulaması: alan Key''i kendi alanına sabit erişim
      sağlar; platform Key''i alan arayüzünü çağırırken ayrıca `X-Tenant-ID` iletilmelidir'
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 'Kullanıcı oturum açma kimlik doğrulaması: `Bearer {token}` biçiminde
      JWT belirteci girin'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
