    type: object
  types.WikiPageListResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      pages:
        items:
          $ref: '#/definitions/types.WikiPage'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  types.WikiPageMoveRequest:
    properties:
      folder_id:
        type: string
      slug:
        type: string
    required:
    - slug
    type: object
  types.WikiPageRevertRequest:
    properties:
      slug:
        type: string
      version:
        type: integer
    required:
    - slug
    - version
    type: object
  types.WikiPageRevision:
    properties:
      aliases:
        items:
          type: string
        type: array
      content:
        type: string
      created_at:
        type: string
      edit_source:
        description: Author of THIS version (same semantics as WikiPage.LastEditSource).
        type: string
      edited_at:
        description: When this version was authored (the page's updated_at while current).
        type: string
      editor_id:
        type: string
      id:
        type: string
      knowledge_base_id:
        type: string
      page_id:
        type: string
      page_type:
        type: string
      slug:
        type: string
      status:
        type: string
      summary:
        type: string
      tenant_id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  types.WikiPageRevisionListResponse:
    properties:
      current_version:
        type: integer
      revisions:
        items:
          $ref: '#/definitions/types.WikiPageRevision'
        type: array
      total:
        type: integer
    type: object
  types.WikiPageUpdateRequest:
    properties:
      aliases:
        items:
          type: string
        type: array
      content:
        type: string
      page_type:
        type: string
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      version:
        description: |-
          Version is the optimistic-lock guard: when > 0 the update is rejected
          with a conflict if the stored version differs (someone else edited the
          page since the client loaded it). 0 skips the check (legacy clients).
        type: integer
    type: object
  types.WikiStats:
    properties:
      is_active:
        description: whether wiki ingestion is currently running
        type: boolean
      orphan_count:
        description: pages with no inbound links
        type: integer
      pages_by_type:
        additionalProperties:
          format: int64
          type: integer
        type: object
      pending_issues:
        description: number of pending wiki issues
        type: integer
      pending_tasks:
        description: number of documents waiting to be ingested
        type: integer
      recent_updates:
        description: last N updated pages
        items:
          $ref: '#/definitions/types.WikiPage'
        type: array
      total_links:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    name: Rethra Github
    url: https://github.com/acrbaran/rag
  description: Rethra bilgi tabanı yönetim sistemi API belgeleri
  termsOfService: http://swagger.io/terms/
  title: Rethra API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: Agent tabanlı akıllı soru-cevap, çok turlu konuşmayı ve SSE akış
        yanıtını destekler
      parameters:
      - description: Oturum ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Soru-cevap isteği
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: Dosya başvuru biçimi; public yüklenebilir doğrudan bağlantı döndürür
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Soru-cevap sonucu (SSE akışı)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Agent soru-cevap
      tags:
      - Soru-Cevap
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: Kullanıcı görüşme sırasında OAuth yetkilendirmesini tamamladıktan
        sonra çağrılır; belirtecin varlığını doğruladıktan sonra duraklatılmış Agent
        araç çağrısını sürdürür
      parameters:
      - description: Yetkilendirme bekleyen ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.AppError'
        "409":
          description: Kullanıcı henüz yetkilendirmeyi tamamlamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Görüşme içi MCP OAuth yetkilendirmesini tamamla
      tags:
      - MCP Hizmetleri
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: Kullanıcı OAuth yetkilendirmesini etkin olarak atlar ve Agent engellemesini
        kaldırır
      parameters:
      - description: Yetkilendirme bekleyen ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Görüşme içi MCP OAuth yetkilendirmesini atla
      tags:
      - MCP Hizmetleri
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: Kullanıcı bir araç çağrısını onaylar veya reddeder (Agent'ın onay
        beklerken engellendiği senaryolarda kullanılır)
      parameters:
      - description: Onay bekleyen kayıt ID'si
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Onay sonucu
          schema:
            additionalProperties: true
            type: object
        "400":
          description: İstek parametresi hatası
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Onay bekleyen kayıt bulunamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Onay bekleyen MCP araç çağrısı isteğini işle
      tags:
      - MCP Hizmetleri
  /agents:
    get:
      consumes:
      - application/json
      description: Geçerli alandaki tüm ajanları al (yerleşik ajanlar dahil)
      produces:
      - application/json
      responses:
        "200":
          description: Ajan listesi
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Sunucu hatası
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Ajan listesini al
      tags:
      - Ajanlar
    post:
      consumes:
      - application/json
      description: Yeni bir özel ajan oluştur
      parameters:
      - description: Ajan bilgileri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Oluşturulan ajan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Ajan oluştur
      tags:
      - Ajanlar
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: Belirtilen aracıyı sil
      parameters:
      - description: Aracı kimliği
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Başarıyla silindi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: Yerleşik aracı silinemez
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Aracı bulunamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Aracıyı sil
      tags:
      - Ajanlar
    get:
      consumes:
      - application/json
      description: ID'ye göre ajan ayrıntılarını al
      parameters:
      - description: Ajan ID'si
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ajan ayrıntıları
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Ajan bulunamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Ajan ayrıntılarını al
      tags:
      - Ajanlar
    put:
      consumes:
      - application/json
      description: Ajanın adını, açıklamasını ve yapılandırmasını güncelle
      parameters:
      - description: Ajan ID'si
        in: path
        name: id
        required: true
        type: string
      - description: Güncelleme isteği
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Güncellenmiş aracı
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: Yerleşik aracı değiştirilemez
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Ajanı güncelle
      tags:
      - Ajanlar
  /agents/{id}/copy:
    post:
      consumes:
      - application/json
      description: Belirtilen aracıyı kopyala
      parameters:
      - description: Aracı kimliği
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Başarıyla kopyalandı
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Aracı bulunamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Aracıyı kopyala
      tags:
      - Ajanlar
  /agents/{id}/shares/{share_id}:
    delete:
      description: Akıllı ajanın paylaşım listesinden belirtilen paylaşım ilişkisini
        kaldır
      parameters:
      - description: Aracı Kimliği
        in: path
        name: id
        required: true
        type: string
      - description: Paylaşım kaydı Kimliği
        in: path
        name: share_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Yetki yok
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Akıllı ajan paylaşımını iptal et
      tags:
      - Organizasyon
  /agents/{id}/suggested-questions:
    get:
      consumes:
      - application/json
      description: Aracıyla ilişkili bilgi tabanına göre, kullanıcıların hızlıca soru
        sorması için önerilen soruları döndürür
      parameters:
      - description: Aracı kimliği
        in: path
        name: id
        required: true
        type: string
      - description: Bilgi tabanı ID listesi (virgülle ayrılmış), ajan varsayılan
          yapılandırmasını geçersiz kılar
        in: query
        name: knowledge_base_ids
        type: string
      - description: Bilgi ID listesi (virgülle ayrılmış), belirli belgelerle sınırlar
        in: query
        name: knowledge_ids
        type: string
      - description: Bilgi tabanı aidiyetine sahip etiket kapsamları (JSON)
        in: query
        name: tag_scopes
        type: string
      - description: Döndürülecek öğe sayısı üst sınırı (gönderilmezse ajan yapılandırmasındaki
          açılış sorusu sayısı kullanılır, en fazla 30)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Önerilen soru listesi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: İstek parametresi hatası
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Ajan bulunamadı
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Önerilen soruları al
      tags:
      - Ajanlar
  /agents/placeholders:
    get:
      consumes:
      - application/json
      description: Kullanılabilir tüm istem yer tutucu tanımlarını alan türüne göre
        gruplanmış olarak al
      produces:
      - application/json
      responses:
        "200":
          description: Yer tutucu tanımları
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Yer tutucu tanımlarını al
      tags:
      - Ajanlar
  /agents/type-presets:
    get:
      consumes:
      - application/json
      description: Düzenleyicinin sistem istemini, araçları ve KB uyumluluğunu otomatik
        doldurması için smart-reasoning altında kullanılabilen tüm aracı türü ön ayarlarını
        (RAG/Wiki/Hybrid/Custom) döndürür
      produces:
      - application/json
      responses:
        "200":
          description: Ön ayar listesi
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Aracı türü ön ayar listesini al
      tags:
      - Ajanlar
  /api/v1/knowledge/{id}/spans:
    get:
      consumes:
      - application/json
      description: 'Bu bilginin ayrıştırma işlem hattındaki trace tree''sini (root
        → stage → subspan) döndürür: her bölümün durumu, süresi, input/output''u,
        hata kodu, langfuse_trace_id. Geçmiş denemeleri görüntülemek için ?attempt=N
        desteklenir; iletilmezse en son deneme döndürülür. Ön yüz, zaman çizelgesini
        + multimodal/embedding alt düğümlerini oluşturmak ve Langfuse''a tek tıkla
        gitmek için kullanır.'
      parameters:
      - description: Bilgi ID'si
        in: path
        name: id
        required: true
        type: string
      - description: Belirtilen deneme numarası; belirtilmezse=en güncel
        in: query
        name: attempt
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Bilgi belgesi ayrıştırmasının Span ağacını alır (geçmiş denemeler dahil)
      tags:
      - Bilgi Yönetimi
  /artifacts:
    delete:
      description: Ürün deposundaki bir dosyayı siler. Ürün deposunda her satır bir
        dosyanın en güncel sürümünü temsil eder; varsayılan olarak bu dosyanın mevcut
        oturumdaki tüm geçmiş sürümleri de birlikte silinir
      parameters:
      - description: Oturum kimliği
        in: query
        name: session_id
        required: true
        type: string
      - description: Mesaj kimliği
        in: query
        name: message_id
        required: true
        type: string
      - description: Ürünün mesaj içindeki konumu
        in: query
        name: index
        required: true
        type: integer
      - description: Tüm sürümlerin silinip silinmeyeceği, varsayılan true
        in: query
        name: all_versions
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Ürün deposundaki dosyayı sil
      tags:
      - Oturumlar
    get:
      description: Geçerli kullanıcının görebildiği oturumlardaki beceriler tarafından
        oluşturulan dosyaları oturumlar arasında listeler; her dosya için yalnızca
        en güncel sürüm döndürülür (depolama URL'si dahil değildir)
      parameters:
      - description: Dosya adına göre filtrele
        in: query
        name: keyword
        type: string
      - description: Virgülle ayrılmış uzantılar, ör. .pdf,.pptx
        in: query
        name: file_types
        type: string
      - description: Sayfa numarası
        in: query
        name: page
        type: integer
      - description: Sayfa başına öğe sayısı（en fazla 100）
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Ürünlerimi listele
      tags:
      - Oturumlar
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Geçerli kullanıcının giriş parolasını değiştirir. Yeni parola 8–32
        karakter uzunluğunda olmalı ve hem harf hem sayı içermelidir; karmaşık parola
        etkinleştirildiğinde büyük/küçük harf ve özel karakter de içermelidir. Başarılı
        olduktan sonra tüm oturumlar iptal edilir ve yeniden giriş yapılması gerekir.
      parameters:
      - description: Parola değiştirme isteği
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Başarıyla değiştirildi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Parolayı değiştir
      tags:
      - Kimlik Doğrulama
  /auth/config:
    get:
      consumes:
      - application/json
      description: Geçerli dağıtımın kayıt modunu ve parola karmaşıklığı anahtarını
        döndürür; ön yüzün kayıt girişini gösterip göstermeyeceğini ve parola doğrulama
        kurallarını belirlemesi için
      produces:
      - application/json
      responses:
        "200":
          description: Kimlik doğrulama yapılandırması
          schema:
            additionalProperties: true
            type: object
      summary: Kimlik doğrulama yapılandırmasını al
      tags:
      - Kimlik Doğrulama
  /auth/heartbeat:
    post:
      description: |-
        Keeps the caller marked as online in the system-admin users table.
        Presence itself is recorded by the auth middleware; this endpoint only
        gives an open but idle tab a cheap request to make.
      responses:
        "204":
          description: Recorded
      security:
      - Bearer: []
      summary: Presence heartbeat
      tags:
      - Kimlik Doğrulama
  /auth/invitations/lookup:
    post:
      consumes:
      - application/json
      description: |-
        Davet bağlantısındaki token'a göre davet bağlamını (alan adı / rol / sona erme zamanı) döndürür,
        kayıt sayfasında görüntülenmek üzere. Kimlik doğrulama yoktur; token geçersizse veya iptal edildiyse 410 döner.
        token'ın erişim günlüklerine / tarayıcı geçmişine / tracing'e düşmesini önlemek için GET + path yerine POST + body kullanılır.
      parameters:
      - description: Davet token'ı
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.invitationLookupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.invitationLookupResponse'
        "410":
          description: Bağlantı geçersiz veya iptal edildi
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      summary: Paylaşılan davet bağlantısı token'ını çözümle
      tags:
      - Kimlik Doğrulama
  /auth/login:
    post:
      consumes:
      - application/json
      description: Kullanıcı giriş yapar ve erişim belirteci alır
      parameters:
      - description: Giriş isteği parametreleri
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "401":
          description: Kimlik doğrulama başarısız
          schema:
            $ref: '#/definitions/errors.AppError'
      summary: Kullanıcı girişi
      tags:
      - Kimlik Doğrulama
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Geçerli erişim belirtecini iptal eder ve çıkış yapar
      produces:
      - application/json
      responses:
        "200":
          description: Çıkış başarılı
          schema:
            additionalProperties: true
            type: object
        "400":
          description: İstek parametreleri hatalı
