          description: A storage backend with this name already exists
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create storage backend
      tags:
      - StorageBackend
