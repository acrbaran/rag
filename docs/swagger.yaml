    delete:
      description: Soft-delete a storage backend. A backend that is the workspace
        default, still bound to knowledge bases, environment-sourced, or a legacy
        alias cannot be deleted.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Backend is default, bound, read-only, or legacy alias
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete storage backend
      tags:
      - StorageBackend
    get:
      description: Retrieve a single storage backend by ID for the current workspace.
        Credentials are masked.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Storage backend details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get storage backend
      tags:
      - StorageBackend
    put:
      consumes:
      - application/json
      description: Update a storage backend's mutable fields (name, credentials, status).
        Provider and physical location (endpoint, region, bucket, path prefix) are
        immutable; use storage migration to move data. Environment-sourced backends
        are read-only. Redacted secret placeholders preserve the stored credentials.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated storage backend fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated storage backend
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Immutable field change, read-only backend, validation, or connectivity
            failure
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update storage backend
      tags:
      - StorageBackend
  /storage-backends/{id}/default:
    put:
      description: Mark a storage backend as the workspace default. Only an active
        backend can become the default. New knowledge bases without an explicit binding
        use the default.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Default set successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Backend is not active
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Set default storage backend
      tags:
      - StorageBackend
  /storage-backends/{id}/test:
    post:
      description: Test connectivity of an existing saved storage backend using its
        stored credentials. Returns success=false with a sanitized error message on
        failure (the HTTP status stays 200).
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Connectivity test result (success, error)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test storage backend by ID
      tags:
      - StorageBackend
  /storage-backends/test:
    post:
      consumes:
      - application/json
      description: Test connectivity for the provided storage configuration without
        persisting it. Returns success=false with a sanitized error message on failure
        (the HTTP status stays 200).
      parameters:
      - description: Storage backend configuration to test
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connectivity test result (success, error)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test storage backend with raw config
      tags:
      - StorageBackend
  /storage-backends/types:
    get:
      description: Return the storage provider types allowed by STORAGE_ALLOW_LIST
        for UI form generation (e.g. local, minio, cos, tos, s3, oss, ks3, obs).
      produces:
      - application/json
      responses:
        "200":
          description: List of allowed storage provider types
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List allowed storage provider types
      tags:
      - StorageBackend
  /system/admin/api-keys:
    get:
      description: Lists non-workspace API keys. Full tokens are always masked. Human
        SystemAdmin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List platform API keys
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: Creates a capability-scoped key that may target any workspace through
        X-Tenant-ID. The plaintext token is returned once. Human SystemAdmin only.
      parameters:
      - description: Platform API key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.platformAPIKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Create a platform API key
      tags:
      - System Admin
  /system/admin/api-keys/{key_id}:
    delete:
      description: Immediately revokes a platform API key. Human SystemAdmin only.
      parameters:
      - description: API key ID
        in: path
        name: key_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Revoke a platform API key
      tags:
      - System Admin
  /system/admin/audit-log:
    get:
      description: system-scope (tenant_id=0) denetim olaylarını döndürür; system.setting_changed
        / system.admin_promoted / system.admin_revoked gibi SystemAdmin işlemlerini
        kapsar. id'ye göre azalan sıralı imleç sayfalaması.
      parameters:
      - description: 'İmleç: id''si bu değerden küçük kayıtları döndürür (varsayılan
          olarak en yeniden başlar)'
        in: query
        name: after_id
        type: integer
      - description: Sayfa boyutu, 1-100, varsayılan 50
        in: query
        name: limit
        type: integer
      - description: action'a göre tam filtreleme (örn. system.setting_changed)
        in: query
        name: action
        type: string
      - description: outcome'a göre tam filtreleme (success / denied)
        in: query
        name: outcome
        type: string
      - description: actor_user_id'ye göre tam filtreleme
        in: query
        name: actor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.auditLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Platform denetim günlüklerini getir
      tags:
      - Denetim Günlükleri
  /system/admin/list:
    get:
      description: |-
        Retrieve a paginated list of users with system administrator
        privileges (SystemAdmin only). Supports `offset` (default 0)
        and `limit` (default 50, max 200) query parameters. Walks the
        partial-friendly idx_users_is_system_admin index.
      parameters:
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Page size (max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: System admins retrieved successfully
          schema:
            $ref: '#/definitions/internal_handler.ListSystemAdminsResponse'
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all system administrators
      tags:
      - System Admin
  /system/admin/promote:
    post:
      consumes:
      - application/json
      description: |-
        Grant system administrator privileges to a user (SystemAdmin only).
        Idempotent: re-promoting an existing system admin returns 200 with no DB write.
        Identify the user by email (preferred for human operators) or user_id (UUID, for API clients).
      parameters:
      - description: User promotion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PromoteUserToSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User promoted successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Promote a user to system administrator
      tags:
      - System Admin
  /system/admin/revoke:
    post:
      consumes:
      - application/json
      description: |-
        Remove system administrator privileges from a user (SystemAdmin only).
        Two safety guards: the caller cannot revoke their own privileges,
        and revoking the last remaining system admin is rejected — both
        prevent a SystemAdmin from accidentally locking the platform out
        of system-level administration. Idempotent on already-non-admin users.
      parameters:
      - description: User revocation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RevokeSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privileges revoked successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request / would remove last admin / self-revoke
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Revoke system administrator privileges from a user
      tags:
      - System Admin
  /system/admin/runtime/queues:
    get:
      description: Her asynq kuyruğunun gerçek zamanlı derinliğini (pending/active/scheduled/retry
        vb.) ve worker eşzamanlılık yapılandırmasını döndürür; yalnızca sistem yöneticileri
        görebilir
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RuntimeQueuesResponse'
      summary: Ayrıştırma görev kuyruğunun çalışma zamanı durumunu al
      tags:
      - Sistem Yönetimi
  /system/admin/runtime/queues/{queue}/archived:
    delete:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Purge all archived tasks in a queue
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/tasks:
    get:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task state
        enum:
        - pending
        - active
        - scheduled
        - retry
        - archived
        - completed
        in: query
        name: state
        required: true
        type: string
      - description: Opaque continuation cursor
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RuntimeTasksResponse'
      summary: List runtime queue tasks by state
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/tasks/{task_id}/actions/{action}:
    post:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Action
        enum:
        - cancel
        - run_now
        - delete
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Run a safe runtime task action
      tags:
      - System Admin
  /system/admin/settings/{key}:
    delete:
      description: |-
        Removes the DB override for :key so the 3-tier resolver
        falls back to the environment variable (when configured)
        or the in-code default. Idempotent — resetting a key
        that was never persisted returns 200.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: Reset acknowledged
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Reset a system setting to ENV / built-in default
      tags:
      - System Admin
    get:
      description: |-
        Returns the row matching :key. 404 when the key is unknown
        to the registry; 200 with the row when known.
      parameters:
      - description: Setting key (e.g. file.max_size_mb)
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the setting row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Key registered but DB row absent
          schema:
            additionalProperties: true
            type: object
      summary: Get a single system setting by key
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: |-
        Persist a new value for :key. Service validates the
        rawValue against the registry's declared value_type and
        rejects mismatches with 400. SystemAdmin only. Emits an
        audit row (action=system.setting_changed) on success.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: New value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateSystemSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the updated row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Bad request / unknown key / type mismatch
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: Update a system setting value
      tags:
      - System Admin
  /system/admin/tenants/apply-default-storage-quota:
    post:
      description: |-
        Reads the current value of `tenant.default_storage_quota_gb`
        (3-tier resolver: DB > ENV > default) and writes that many
        GiB into storage_quota for every row in tenants. Bypasses
        the per-workspace PUT whitelist, which forbids storage_quota
        edits by Owners. SystemAdmin only.
        Idempotent — running twice with the same setting is a no-op.
      produces:
      - application/json
      responses:
        "200":
          description: '{ affected: int64, quota_bytes: int64 }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Apply the default storage quota to every existing workspace
      tags:
      - System Admin
  /system/admin/users:
    get:
      description: |-
        Retrieve a paginated list of every registered user together with their
        active workspace memberships (SystemAdmin only). Supports `offset`
        (default 0), `limit` (default 20, max 100) and `q` (case-insensitive
        substring of email, username, first or last name, or phone).
      parameters:
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Search keyword
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved successfully
          schema:
            $ref: '#/definitions/internal_handler.ListSystemUsersResponse'
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all users
      tags:
      - System Admin
  /system/admin/users/{user_id}:
    delete:
      description: |-
        Delete another user's account (SystemAdmin only). All of the user's workspace
        memberships are removed and every session is revoked. A system administrator
        cannot delete their own account, and the last system administrator cannot be deleted.
        A user who is the only owner of a workspace cannot be deleted until ownership is
        transferred; the 409 response lists those workspaces.
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Self delete / last system admin
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Sole owner of one or more workspaces
          schema:
            additionalProperties: true
            type: object
      summary: Delete a user
      tags:
      - System Admin
  /system/admin/users/create:
    post:
      consumes:
      - application/json
      description: |-
        Provision a new local user account (SystemAdmin only).
        When `password` is omitted or null, a cryptographically random
        password is generated (OIDC-style crypto/rand + base64url)
        and returned once in the response body. Any provided value,
        including empty string, is policy-checked. Tenant provisioning
        follows the shared auth.default_tenant_mode policy.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.AdminCreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identity already exists, returns the existing user
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "400":
          description: Invalid request or weak password
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email and username refer to conflicting identities
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (SystemAdmin)
      tags:
      - System Admin
  /system/admin/users/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Replace another user's local password and revoke all of their existing sessions (SystemAdmin only).
        A system administrator cannot reset their own password through this endpoint; self-service password change still requires the old password.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request, weak password, or self reset
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Reset another user's password
      tags:
      - System Admin
  /system/admin/workspaces:
    get:
      description: |-
        Paginated list of every workspace with its owners and member count (SystemAdmin only).
        `q` matches name/description, or the workspace ID when numeric.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 50)
        in: query
        name: page_size
        type: integer
      - description: Search keyword
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListSystemWorkspacesResponse'
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all workspaces
      tags:
      - System Admin
  /system/admin/workspaces/{id}:
    delete:
      description: Delete any workspace together with all of its memberships (SystemAdmin
        only).
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Workspace not found
          schema:
            additionalProperties: true
            type: object
      summary: Delete a workspace
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: Change any workspace's name (SystemAdmin only).
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateSystemWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Blank or too long name
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Workspace not found
          schema:
            additionalProperties: true
            type: object
      summary: Rename a workspace
      tags:
      - System Admin
  /system/admin/workspaces/{id}/members:
    get:
      description: Every member of the workspace with their role (SystemAdmin only).
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListSystemWorkspaceMembersResponse'
        "404":
          description: Workspace not found
          schema:
            additionalProperties: true
            type: object
      summary: List a workspace's members
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: Add a registered user to any workspace by email with the given
        role (SystemAdmin only).
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: integer
      - description: Email and role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.TenantMemberResponse'
        "404":
          description: Workspace or user not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Already a member
          schema:
            additionalProperties: true
            type: object
      summary: Add a member to a workspace
      tags:
      - System Admin
  /system/admin/workspaces/{id}/members/{user_id}:
    delete:
      description: |-
        Remove a member from any workspace (SystemAdmin only). The removed user's sessions are
        revoked, so an administrator cannot remove themselves here. The last owner cannot be removed.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Self removal
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Workspace or membership not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Last owner
          schema:
            additionalProperties: true
            type: object
      summary: Remove a member from a workspace
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: Change the role of a member inside any workspace (SystemAdmin only).
        The last owner cannot be demoted.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
