basePath: /api/v1
definitions:
  errors.AppError:
    properties:
      code:
        type: integer
      details: {}
      message:
        type: string
    type: object
  github_com_acrbaran_rag_internal_application_service.WikiLintIssue:
    properties:
      auto_fixable:
        type: boolean
      description:
        type: string
      page_slug:
        type: string
      severity:
        $ref: '#/definitions/github_com_acrbaran_rag_internal_application_service.WikiLintIssueSeverity'
      target_slug:
        description: |-
          TargetSlug identifies the other page involved in the issue (e.g. the
          broken link target, or the entity slug for a missing cross-ref). It is
          the structured field used by AutoFix instead of parsing Description.
        type: string
      type:
        $ref: '#/definitions/github_com_acrbaran_rag_internal_application_service.WikiLintIssueType'
    type: object
  github_com_acrbaran_rag_internal_application_service.WikiLintIssueSeverity:
    enum:
    - info
    - warning
    - error
    type: string
    x-enum-varnames:
    - SeverityInfo
    - SeverityWarning
    - SeverityError
  github_com_acrbaran_rag_internal_application_service.WikiLintIssueType:
    enum:
    - orphan_page
    - broken_link
    - stale_ref
    - missing_cross_ref
    - empty_content
    - duplicate_slug
    type: string
    x-enum-varnames:
    - LintIssueOrphanPage
    - LintIssueBrokenLink
    - LintIssueStaleRef
    - LintIssueMissingCrossRef
    - LintIssueEmptyContent
    - LintIssueDuplicateSlug
  github_com_acrbaran_rag_internal_application_service.WikiLintReport:
    properties:
      health_score:
        description: 0-100
        type: integer
      issues:
        items:
          $ref: '#/definitions/github_com_acrbaran_rag_internal_application_service.WikiLintIssue'
        type: array
      knowledge_base_id:
        type: string
      stats:
        $ref: '#/definitions/types.WikiStats'
      summary:
        type: string
    type: object
  github_com_acrbaran_rag_internal_datasource.ConnectorMetadata:
    properties:
      auth_type:
        description: '"oauth2", "api_key", "token", etc.'
        type: string
      capabilities:
        description: '"incremental", "webhook", "deletion_sync", etc.'
        items:
          type: string
        type: array
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      priority:
        description: Priority order for UI display (lower = higher priority)
        type: integer
      type:
        type: string
    type: object
  github_com_acrbaran_rag_internal_errors.AppError:
