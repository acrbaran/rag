      produces:
      - application/json
      responses:
        "200":
          description: Web arama yapılandırması
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Hatalı istek parametreleri
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Alan web arama yapılandırmasını al
