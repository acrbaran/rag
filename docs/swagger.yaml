  /vector-stores:
    get:
      description: List all vector stores for the current workspace, including environment-configured
        and user-created stores
      produces:
      - application/json
      responses:
        "200":
          description: List of vector stores (env + DB)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List vector stores
      tags:
      - VectorStore
    post:
      consumes:
      - application/json
      description: Create a new vector store configuration for the current workspace
      parameters:
      - description: Vector store configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Duplicate endpoint and index
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create vector store
      tags:
      - VectorStore
  /vector-stores/{id}:
    delete:
      description: Soft-delete a vector store. Env stores cannot be deleted.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store cannot be deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete vector store
      tags:
      - VectorStore
    get:
      description: Retrieve a single vector store by ID. Supports both DB stores and
        env stores (__env_* IDs)
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Vector store details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get vector store
      tags:
      - VectorStore
    put:
      consumes:
      - application/json
      description: Update a vector store (name only). Engine type, connection config,
        and index config are immutable. Env stores cannot be modified.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update vector store
      tags:
      - VectorStore
  /vector-stores/{id}/test:
    post:
      description: Test connectivity of an existing saved or env store. Returns detected
        server version. For DB stores, the version is automatically saved to connection_config.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection by ID
      tags:
      - VectorStore
  /vector-stores/test:
    post:
      consumes:
      - application/json
      description: Test connectivity using provided credentials without persisting.
        Returns detected server version.
      parameters:
      - description: Engine type and connection config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.TestStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection with raw credentials
      tags:
      - VectorStore
  /vector-stores/types:
    get:
      description: Return supported engine types with connection and index field schemas
        for UI form generation
      produces:
      - application/json
      responses:
        "200":
          description: List of engine types with config schemas
          schema:
            additionalProperties: true
            type: object
      summary: List vector store types
      tags:
      - VectorStore
  /web-search-providers/{id}:
