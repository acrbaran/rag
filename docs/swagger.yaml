      - Alan Yönetimi
  /tenants/search:
    get:
      consumes:
      - application/json
      description: Sayfalandırılmış alan araması (alanlar arası erişim izni gerektirir)
      parameters:
      - description: Arama anahtar kelimesi
        in: query
        name: keyword
        type: string
      - description: Alan kimliği filtresi
        in: query
        name: tenant_id
        type: integer
      - default: 1
        description: Sayfa numarası
        in: query
        name: page
        type: integer
      - default: 20
        description: Sayfa başına öğe sayısı
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Arama sonuçları
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Yetersiz izin
          schema:
            $ref: '#/definitions/errors.AppError'
