    - model_id
    type: object
  internal_handler.GetStorageEngineStatusResponse:
    properties:
      allowed_providers:
        items:
          type: string
        type: array
      engines:
        items:
          $ref: '#/definitions/internal_handler.StorageEngineStatusItem'
        type: array
      minio_env_available:
        type: boolean
    type: object
  internal_handler.GetSystemInfoResponse:
    properties:
      build_time:
        type: string
      commit_id:
        type: string
      db_migration_error:
        description: |-
          DBMigrationError carries the human-readable error message recorded when
          the most recent startup migration attempt failed. Empty when migrations
          succeeded; non-empty values let the frontend surface a troubleshooting
          banner instead of silently hiding the DB version row (see issue #1319).
        type: string
      db_version:
        type: string
      edition:
        type: string
      go_version:
        type: string
      graph_database_engine:
        type: string
      keyword_index_engine:
        type: string
      minio_enabled:
        type: boolean
      started_at:
        description: StartedAt is the server process boot time (RFC3339, UTC).
        type: string
      uptime_seconds:
        description: UptimeSeconds is seconds elapsed since process start.
        type: integer
      vector_store_engine:
        type: string
      version:
        type: string
    type: object
  internal_handler.InitializationRequest:
    properties:
      documentSplitting:
        properties:
          chunkOverlap:
            minimum: 0
            type: integer
          chunkSize:
            maximum: 10000
            minimum: 100
            type: integer
          separators:
            items:
              type: string
            minItems: 1
            type: array
        required:
        - chunkSize
        - separators
        type: object
      embedding:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          dimension:
            description: embedding boyutu alanı eklendi
            type: integer
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      llm:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      multimodal:
        properties:
          cos:
            properties:
              appId:
                type: string
              bucketName:
                type: string
              pathPrefix:
                type: string
              region:
                type: string
              secretId:
                type: string
              secretKey:
                type: string
            type: object
          enabled:
            type: boolean
          minio:
            properties:
              bucketName:
                type: string
              pathPrefix:
                type: string
            type: object
          storageType:
            type: string
          vlm:
            properties:
              apiKey:
                type: string
              baseUrl:
                type: string
              interfaceType:
                description: '"openai"'
                type: string
              modelName:
                type: string
            type: object
        type: object
      nodeExtract:
        properties:
          enabled:
            type: boolean
          nodes:
            items:
              properties:
                attributes:
                  items:
                    type: string
                  type: array
                name:
                  type: string
              type: object
            type: array
          relations:
            items:
              properties:
                node1:
                  type: string
                node2:
                  type: string
                type:
                  type: string
              type: object
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        properties:
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      rerank:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          enabled:
            type: boolean
          modelName:
            type: string
        type: object
    required:
    - documentSplitting
    - embedding
    - llm
    type: object
  internal_handler.KBModelConfigRequest:
    properties:
      asr_config:
        $ref: '#/definitions/types.ASRConfig'
      documentSplitting:
        description: Belge parçalama yapılandırması
        properties:
          childChunkSize:
            type: integer
          chunkOverlap:
            type: integer
          chunkSize:
            type: integer
          enableParentChild:
            type: boolean
          languages:
            items:
              type: string
            type: array
          parentChunkSize:
            type: integer
          parserEngineRules:
            items:
              $ref: '#/definitions/types.ParserEngineRule'
            type: array
          separators:
            items:
              type: string
            type: array
          strategy:
            description: |-
              Strategy / TokenLimit / Languages use pointer types so the
              handler can distinguish "field absent in payload" (no change)
              from "field present with empty/zero value" (clear / disable).
              Without that distinction, users could set strategy="auto" once
              but never reset it back to legacy / unset.
            type: string
          tableMetadataInstructions:
            type: string
          tokenLimit:
            type: integer
        type: object
      embeddingModelId:
        description: optional when RAG indexing is disabled
        type: string
      llmModelId:
        type: string
      multimodal:
        description: Çok modlu yapılandırma (yalnızca modelle ilgili; depolama motoru
          storageProvider içinde yapılandırılır)
        properties:
          enabled:
            type: boolean
        type: object
      nodeExtract:
        description: Bilgi grafiği yapılandırması
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          nodes:
            items:
              $ref: '#/definitions/types.GraphNode'
            type: array
          relations:
            items:
              $ref: '#/definitions/types.GraphRelation'
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        description: Soru oluşturma yapılandırması
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      storageBackendId:
        type: string
      storageProvider:
        description: Depolama motoru seçimi ("local" | "minio" | "cos"); belge yüklemeyi
          ve belge içindeki görsellerin depolanmasını etkiler, parametreler genel
          ayarlardan okunur
        type: string
      vlm_config:
        $ref: '#/definitions/types.VLMConfig'
    required:
    - llmModelId
    type: object
