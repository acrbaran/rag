  /sandbox-configs/{id}/skills:
    get:
      description: List the agent skills installed onto one sandbox config's image.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Installed skills
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Sandbox config not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List installed skills
      tags:
      - SandboxConfig
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: |-
        Install a skill onto this sandbox config's image. Send a zip
        as multipart form field "file", or JSON {"source":"..."} to
        pull a public skill. source is one of: "@owner/slug" or a
        slash-free slug (ClawHub), a github.com / gitlab.com /
        skills.sh / clawhub / skillhub URL, a ClawHub skills-sh
        catalog page (https://clawhub.ai/skills-sh/owner/repo/slug),
        a skills-sh:owner/repo/slug locator, or a direct zip/SKILL.md
        URL. Bare "owner/slug" is rejected as ambiguous. The source
        must be readable anonymously. The install boots a sandbox and
        runs for minutes, so the request is only accepted; follow it
        via the install-events stream.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill bundle (zip)
        in: formData
        name: file
        type: file
      - description: Install from a registry, git host, or archive URL
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handler.skillSourceRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Install accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing, oversized or invalid bundle or source
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Sandbox config not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Install a skill
      tags:
      - SandboxConfig
  /sandbox-configs/{id}/skills/{skillId}:
    delete:
      description: |-
        Remove a skill from the config's image. The removal rebuilds
        the image and runs for minutes, so it is only accepted; follow
        it via the install-events stream.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill ID
        in: path
        name: skillId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Removal accepted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Skill not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Remove an installed skill
      tags:
      - SandboxConfig
    get:
      description: Retrieve one installed skill of a sandbox config.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill ID
        in: path
        name: skillId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Installed skill
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Skill not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get an installed skill
      tags:
      - SandboxConfig
    patch:
      consumes:
      - application/json
      description: Show or hide an installed skill and set the workspace-wide values
        of the environment variables it declared. Either field may be sent, or both.
        The files stay in the image either way; removal is a separate flow.
      parameters:
      - description: Sandbox config ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill ID
        in: path
        name: skillId
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.skillPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated skill
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Skill not found
          schema:
            $ref: '#/definitions/github_com_acrbaran_rag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update an installed skill
      tags:
      - SandboxConfig
