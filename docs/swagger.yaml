      - application/json
      description: |-
        Owner tarafından oluşturulan paylaşılan davet bağlantısı token'ı aracılığıyla kaydı tamamlar ve invite_only modu engelini aşar.
        Kaydolan kişi e-posta adresini kendisi girer (token'a bağlı değildir); kayıt başarılı olduktan sonra ilgili alana otomatik olarak eklenir.
      parameters:
      - description: Davetle kayıt isteği
        in: body
