# Optional dedicated embed origin — uncomment and set server_name (e.g. embed.example.com).
# Serve only embed.html + static assets; proxy /api to the Rethra backend.
# See website-docs/03-features/13-embed-channel.md#embed-subdomain
#
# server {
#     listen 80;
#     server_name embed.example.com;
#     client_max_body_size ${MAX_FILE_SIZE};
#     location = /rethra-widget.js { root /usr/share/nginx/html; }
#     # Copy the /embed/, /_embed-frame-policy, and internal /embed.html
#     # locations from the server below; all are required for the host allowlist.
#     location ^~ /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
#     location /api/ { proxy_pass http://rethra-backend:8080; proxy_set_header Host $host; }
# }

server {
    listen 80;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    # Statik kaynaklar için gzip sıkıştırmasını etkinleştir (ön uç index.js tek dosyası ~1MB, sıkıştırılmadan ölçümlerde 20s+,
    # sıkıştırıldıktan sonra yaklaşık 200-300KB; ana karada aynı bölgedeki düşük bant genişlikli makinelerde yükleme 25s'den 3-5s'ye düşer)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # Güvenlik başlığı yapılandırması
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hata günlüğü yapılandırması
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Static widget loader for third-party sites
    location = /rethra-widget.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal fallback target for /embed/* routes. Keep it separate from the
    # main SPA location so embed pages do not inherit X-Frame-Options.
    location = /embed.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Embed widget pages may be loaded inside third-party iframes (lightweight embed.html)
    location ^~ /embed/ {
        root /usr/share/nginx/html;
        # Keep the original location through the access phase and file serving.
        # An internal redirect to /embed.html would lose the per-channel CSP.
        auth_request /_embed-frame-policy;
        auth_request_set $embed_frame_csp $upstream_http_content_security_policy;
        add_header Content-Security-Policy $embed_frame_csp always;
        try_files /embed.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fail closed if the backend cannot resolve an enabled channel and policy.
    location = /_embed-frame-policy {
        internal;
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/v1/embed-frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Embed-Page-URI $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Ön uç statik dosyaları
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html ve SPA fallback önbelleğe alınamaz; aksi hâlde ön uç yükseltmesinden sonra kullanıcılar yeni sürümü göremez
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header üst katmandan devralınmaz; güvenlik başlıkları location içinde tekrar tanımlanmalıdır
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite derleme çıktısındaki /assets/* hash'li dosya adları içerir ve uzun süre önbelleğe alınabilir
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Yerel depolama dosyalarını arka uç hizmetine yönlendirir (markdown içindeki görselleri oluşturmak için kullanılır)
    # /files için tam eşleşme; Nginx'in otomatik olarak / ekleyip 301 tetiklemesini önler
    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kaynak yeteneği kısa bağlantısı /r/<token>: IM kanallarında resource:// görsellerinin oluşturulması bu rotaya bağlıdır,
    # Bu bölüm olmadan SPA fallback'e düşer, boş sayfa döner ve görseller yüklenemez.
    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserSkill connects from the user's Chrome through this public gateway.
    # The /authorize POST continues through the ordinary API proxy below.
    location = /api/v1/local-browser/extension {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # Cluster RPC is only reachable directly between app nodes.
    location = /api/v1/local-browser/internal {
        return 404;
    }

    # Interactive sandbox terminal / desktop: WebSocket upgrade +
    # query-stripped logs (the handshake carries a short-lived ticket
    # in the query string). Desktop must share this location: the
    # generic /api/ proxy clears Connection, so gorilla Upgrade() would
    # otherwise reject the handshake with 400.
    location ~ ^/api/v1/sessions/[^/]+/sandbox/(terminal|desktop)$ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        access_log /var/log/nginx/access.log api_no_query;
    }

    # Beceri zip yüklemesi için iki koleksiyon rotası; body sınırı MAX_SKILL_BUNDLE_SIZE değerine yükseltilir.
    # Site genelindeki sınırı artırmak yerine ayrı bir location yapılır: client_max_body_size
    # location bazında geçerlidir; server düzeyinde yazılması bilgi tabanı yükleme gibi uç noktaların da beceri paketi boyutunda
    # body alabilmesine neden olur. Burada /api/ öncesinde yer alır; regex location, önek location eşleşmesine göre önceliklidir.
    # Yalnızca koleksiyonun kendisiyle eşleşir (POST yükleme / GET listesi); /install, PATCH gibi alt yolları içermez:
    # Bunlar küçük JSON'lardır ve aşağıdaki /api/ için MAX_FILE_SIZE kullanmaya devam etmelidir.
    location ~ ^/api/v1/(?:skills/catalog|sandbox-configs/[^/]+/skills)/?$ {
        client_max_body_size ${MAX_SKILL_BUNDLE_SIZE};

        # Regex location içindeki proxy_pass URI içeremez; özgün yol aynen iletilir,
        # ve /api/ satırındaki `proxy_pass .../api/` yeniden yazım sonucuyla tutarlıdır.
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        include /etc/nginx/api-proxy.conf;
    }

    # Public Streamable HTTP MCP endpoints use their own bearer-token auth.
    # Preserve /mcp/<endpoint_id> and the same streaming settings as the API.
    location ^~ /mcp/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        include /etc/nginx/api-proxy.conf;
    }

    # API isteklerini arka uç hizmetine yönlendirir
    # APP_SCHEME varsayılan olarak http'tir; uzak HTTPS arka uç için https olarak ayarlanabilir
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        include /etc/nginx/api-proxy.conf;
    }

    # Hata sayfası
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
