# Shared backend proxy settings for the /api/ and /mcp/ locations.
#
# The API, skill-upload and MCP locations share headers and streaming behavior.
# Only proxy_pass stays in each location, since a regex location cannot carry
# a URI in it.
#
# This file is copied verbatim, not run through envsubst, so $host and friends
# survive as nginx variables.

# Preserve the public port for same-origin embed API checks on HTTP deployments.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Bağlantı ve yeniden deneme yapılandırması
proxy_connect_timeout 30s;                 # Bağlantı zaman aşımı süresi
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;               # Yeniden deneme sayısı
proxy_next_upstream_timeout 30s;           # Yeniden deneme zaman aşımı süresi

# SSE ile ilgili yapılandırma
proxy_http_version 1.1;                    # HTTP/1.1 kullan
proxy_set_header Connection "";            # Connection: close'u devre dışı bırak, bağlantıyı açık tut
chunked_transfer_encoding off;             # Parçalı aktarım kodlamasını kapat
proxy_buffering off;                       # Arabelleğe almayı kapat
proxy_cache off;                           # Önbelleğe almayı kapat
proxy_read_timeout 3600s;                  # Okuma zaman aşımı süresini artır
proxy_send_timeout 3600s;                  # Gönderme zaman aşımı süresini artır
